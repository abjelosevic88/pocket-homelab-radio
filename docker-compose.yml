# Pocket Radio — internet radio and stations of your own (Go + SQLite). One container, one volume.
services:
  pocket-radio:
    image: ghcr.io/abjelosevic88/pocket-homelab-radio:latest
    container_name: pocket-radio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      # SECURE_COOKIES: "true"          # behind HTTPS
      # First admin (only used while the database has no users):
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # The owner's own connections; everything can also be set under Settings.
      NOTIFY_URL: ${NOTIFY_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # The station directory (radio-browser.info; "off" = add stations by address only):
      # RADIO_DIRECTORY_URL: https://de1.api.radio-browser.info
      # Stations on your own network (an Icecast at home):
      # ALLOW_LOCAL_STREAMS: "true"
      # Pocket Core: one sign-in and app links instead of tokens.
      # CORE_URL: http://pocket-core:8080
      # CORE_REGISTRATION_KEY: ${CORE_REGISTRATION_KEY}
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
